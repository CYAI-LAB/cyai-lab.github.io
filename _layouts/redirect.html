---
---
{% assign computed = "https://cyai.sejong.ac.kr" | append: page.url %}
{% assign target = page.target | default: computed %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url={{ target }}">
  <link rel="canonical" href="{{ target }}">
  <meta name="robots" content="noindex">
  <title>이전 안내 — CYAI Lab</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 5rem auto;
      padding: 0 1rem;
      color: #333;
      line-height: 1.6;
    }
    h1 { font-size: 1.4rem; margin-bottom: 1rem; }
    a { color: #00bcd4; }
  </style>
</head>
<body>
  <h1>CYAI Lab 사이트가 이전되었습니다</h1>
  <p>새 주소: <a href="{{ target }}">{{ target }}</a></p>
  <p>자동으로 이동되지 않으면 위 링크를 클릭해주세요.</p>
  <script>window.location.replace({{ target | jsonify }});</script>
</body>
</html>
